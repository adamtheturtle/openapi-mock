[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools", "setuptools-scm>=8.1.0" ]

[project]
name = "openapi-mock"
description = "Serve an OpenAPI spec as a mock with HTTPX2, respx or responses."
readme = { file = "README.rst", content-type = "text/x-rst" }
keywords = [ "httpx", "httpx2", "mock", "openapi", "responses", "respx" ]
license = "MIT"
license-files = [ "LICENSE" ]
authors = [ { name = "Adam Dangoor", email = "adamdangoor@gmail.com" } ]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
    "beartype>=0.23.0",
    "httpx>=0.27.0",
    "httpx2>=2.12.0",
    "openapi-pydantic>=0.5.0",
    "pydantic>=2.0.0",
    "responses>=0.25.3",
    "respx>=0.22.0",
]
urls = { Homepage = "https://github.com/adamtheturtle/openapi-mock", Documentation = "https://adamtheturtle.github.io/openapi-mock/" }

[dependency-groups]
dev = [
    "actionlint-py==1.7.12.25",
    "beartype==0.23.0",
    "check-manifest==0.51",
    "deptry==0.25.1",
    "doc8==2.0.0",
    "doccmd==2026.9.16.1",
    "furo==2025.12.19",
    "interrogate==1.7.0",
    "mypy==2.4.0",
    "mypy-pytest-parametrize==2026.10.5.1",
    "mypy-strict-kwargs==2026.8.25.1",
    "myst-parser==5.1.0",
    "no-defaults==2026.9.1",
    "prek==0.5.5",
    "pydocstringformatter==1.0.0",
    "pylint[spelling]==4.1.2",
    "pylint-per-file-ignores==4.0.0",
    "pyproject-fmt==2.30.1",
    "pyrefly==1.3.2",
    "pyright==1.1.414",
    "pyroma==5.0.1",
    "pytest==9.1.1",
    "pytest-beartype==0.3.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
    "shellcheck-py==0.11.0.1",
    "shfmt-py==4.2.0",
    "snapper-fmt==0.11.9",
    "sphinx==9.1.0",
    "sphinx-copybutton==0.5.2",
    "sphinx-lint==1.0.2",
    "sphinx-pyproject==0.3.0",
    "sphinx-substitution-extensions==2026.8.13.1",
    "sphinxcontrib-spelling==8.0.2",
    # ``sphinxcontrib-towncrier`` renders unreleased news fragments
    # as Markdown in docs/source/unreleased.md during Sphinx builds.
    "sphinxcontrib-towncrier==0.5.0a0",
    "strict-kwargs==2026.8.28.post2",
    "sybil[pytest]==10.1.0",
    "towncrier==26.9.0",
    "ty==0.0.84",
    "types-requests>=2.32.0",
    "vale==3.22.0.0",
    "vulture==2.16",
    "yamlfix==1.19.1",
    "zizmor==1.30.1",
]
release = [ "check-wheel-contents==0.6.3", "towncrier==26.9.0" ]

[tool.setuptools]
packages.find.where = [ "src" ]
package-data.openapi_mock = [ "py.typed" ]
zip-safe = false

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.ruff]
target-version = "py312"
line-length = 88
lint.extend-select = [ "ANN", "C901", "ERA001", "PGH003", "PYI" ]
lint.explicit-preview-rules = true
lint.unfixable = [ "ERA001" ]
lint.external = [ "NOD" ]
lint.flake8-tidy-imports.banned-api."operator.attrgetter".msg = "operator.attrgetter is banned: use a lambda instead."
lint.flake8-tidy-imports.banned-api."typing.cast".msg = """\
    typing.cast is banned: use explicit type narrowing or a typed variable instead.\
    """
lint.mccabe.max-complexity = 12
lint.preview = true

[tool.pylint]
DEPRECATED_BUILTINS.bad-functions = [
    # Use Pylint until Ruff can ban bare builtin calls, or until custom rules
    # make this removable:
    # https://github.com/astral-sh/ruff/issues/10079
    # https://github.com/astral-sh/ruff/issues/970
    "filter",
    "getattr",
    "hasattr",
    "map",
    "setattr",
]
# Return non-zero exit code if useless-suppression is emitted.
MAIN.fail-on = [
    "useless-suppression",
]
MASTER.jobs = 0
MASTER.load-plugins = [
    "pylint.extensions.bad_builtin",
    "pylint_per_file_ignores",
]
MESSAGES-CONTROL.disable = [
    "duplicate-code",
    "import-outside-toplevel",
    "line-too-long",
    "reimported",
    "too-many-branches",
    "too-many-return-statements",
    "ungrouped-imports",
    "unspecified-encoding",
    "unused-argument",
    "unused-import",
    "wrong-import-order",
]
MESSAGES-CONTROL.enable = [ "spelling" ]
MESSAGES-CONTROL.per-file-ignores = [
    "docs/source/conf.py:invalid-name",
    "docs/source/doccmd_*.py:missing-module-docstring,invalid-name",
    "doccmd_README_rst_*.py:missing-module-docstring,invalid-name",
    "tests/test_parametrized.py:too-many-lines,too-many-arguments",
]
SPELLING.spelling-dict = "en_US"
SPELLING.spelling-private-dict-file = "spelling_private_dict.txt"
SPELLING.spelling-store-unknown-words = "no"

[tool.interrogate]
fail-under = 100
verbose = 2
omit-covered-files = true

[tool.check-manifest]
ignore = [
    "*.pyc",
    ".editorconfig",
    ".git_archival.txt",
    ".prettierrc",
    ".vale.ini",
    ".vscode/*.json",
    "__pycache__",
    "__pycache__/**",
    "CHANGELOG.md",
    "CODE_OF_CONDUCT.rst",
    "conftest.py",
    "CONTRIBUTING.rst",
    "docs",
    "docs/**",
    "docs/build",
    "docs/build/**",
    "newsfragments",
    "newsfragments/**",
    "prek.toml",
    "spelling_private_dict.txt",
    "styles/snapper/**",
    "tests",
    "tests/**",
    "uv.lock",
    "zizmor.yml",
]

[tool.vulture]
exclude = [ ".venv" ]
ignore_names = [
    "add_openapi_to_responses",
    "add_openapi_to_respx",
    "base_url",
    # Sphinx
    "copybutton_exclude",
    "create_httpx2_transport",
    "extensions",
    "html_show_copyright",
    "html_show_sourcelink",
    "html_show_sphinx",
    "html_theme",
    "html_theme_options",
    "html_title",
    "htmlhelp_basename",
    "intersphinx_mapping",
    "nitpick_ignore",
    "nitpicky",
    "project_copyright",
    # pytest configuration
    "pytest_collect_file",
    "request",
    "rst_prolog",
    "spelling_word_list_filename",
    "templates_path",
    "towncrier_draft_autoversion_mode",
    "towncrier_draft_include_empty",
    "towncrier_draft_working_directory",
]

[tool.pyproject-fmt]
indent = 4
keep_full_version = true
max_supported_python = "3.14"

[tool.mypy]
files = [ "." ]
exclude = [ ".venv", "build" ]
exclude_gitignore = true
strict = true
plugins = [ "mypy_pytest_parametrize", "mypy_strict_kwargs" ]
num_workers = "auto"

[tool.pyrefly]
errors.non-exhaustive-match = "error"
enabled-ignores = [ "pyrefly" ]
preset = "all"

[tool.pyright]
typeCheckingMode = "strict"
exclude = [ ".venv", "build" ]
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = true

[tool.ty]
rules.all = "error"
terminal.error-on-warning = true
analysis.respect-type-ignore-comments = false
analysis.strict-equality-semantics = true
analysis.strict-generic-narrowing = true

[tool.pytest]
beartype_packages = [ "openapi_mock" ]
beartype_test_fixtures = true
beartype_tests = true
log_cli = true
xfail_strict = true

[tool.coverage]
run.source = [ "src/", "tests" ]
run.branch = true
report.fail_under = 100
report.exclude_also = [ "if TYPE_CHECKING:" ]
report.show_missing = true

[tool.towncrier]
# Write the same native Markdown file used by documentation and GitHub releases.
directory = "newsfragments"
filename = "docs/source/changelog/{version}.md"
title_format = "# {version} ({project_date})"
issue_format = "[#{issue}](https://github.com/adamtheturtle/openapi-mock/issues/{issue})"
single_file = false
# Reject invalid fragment names instead of silently losing release entries.
ignore = [ ".gitkeep" ]
type = [ { directory = "change", name = "Changes", showcontent = true } ]

[tool.pydocstringformatter]
write = true
split-summary-body = false
max-line-length = 88

[tool.doc8]
max_line_length = 2000
ignore_path = [
    "./.eggs",
    "./docs/build",
    "./node_modules",
    "./src/*.egg-info/",
]

[tool.yamlfix]
section_whitelines = 1
whitelines = 1

[tool.no_defaults]
private_only = true
per_file_enforcement."tests/**" = "all"
