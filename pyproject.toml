[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools", "setuptools-scm>=8.1.0" ]

[project]
name = "openapi-mock"
description = "Serve an OpenAPI spec as a mock with respx."
readme = { file = "README.rst", content-type = "text/x-rst" }
keywords = [ "httpx", "mock", "openapi", "respx" ]
license = "MIT"
license-files = [ "LICENSE" ]
authors = [ { name = "Adam Dangoor", email = "adamdangoor@gmail.com" } ]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
    "beartype>=0.18",
    "httpx>=0.27.0",
    "openapi-pydantic>=0.5.0",
    "pydantic>=2.0.0",
    "responses>=0.25.3",
    "respx>=0.22.0",
]
optional-dependencies.dev = [
    "actionlint-py==1.7.12.24",
    "check-manifest==0.51",
    "deptry==0.25.1",
    "doc8==2.0.0",
    "doccmd==2026.8.16",
    "furo==2025.12.19",
    "interrogate==1.7.0",
    "mypy[faster-cache]==2.3.1",
    "mypy-strict-kwargs==2026.7.19.1",
    "no-defaults==2.1.0",
    "prek==0.4.14",
    "pydocstringformatter==1.0.0",
    "pylint[spelling]==4.0.7",
    "pylint-per-file-ignores==3.2.1",
    "pyproject-fmt==2.28.0",
    "pyrefly==1.2.0",
    "pyright==1.1.411",
    "pyroma==5.0.1",
    "pytest==9.1.1",
    "pytest-beartype-tests==2026.8.16",
    "pytest-cov==7.1.0",
    "ruff==0.16.3",
    "shellcheck-py==0.11.0.1",
    "shfmt-py==4.0.0",
    "sphinx==9.1.0",
    "sphinx-copybutton==0.5.2",
    "sphinx-lint==1.0.2",
    "sphinx-pyproject==0.3.0",
    "sphinx-substitution-extensions==2026.8.13.1",
    "sphinxcontrib-spelling==8.0.2",
    # ``sphinxcontrib-towncrier`` renders unreleased news fragments
    # into docs/source/unreleased.rst during Sphinx builds.
    "sphinxcontrib-towncrier==0.5.0a0",
    "strict-kwargs==2026.8.16",
    "sybil[pytest]==10.1.0",
    "towncrier==25.8.0",
    "ty==0.0.72",
    "types-requests>=2.32.0",
    "vale==3.17.1.0",
    "vulture==2.16",
    "yamlfix==1.19.1",
    "zizmor==1.29.0",
]
optional-dependencies.release = [ "check-wheel-contents==0.6.3", "towncrier==25.8.0" ]
urls = { Homepage = "https://github.com/adamtheturtle/openapi-mock", Documentation = "https://adamtheturtle.github.io/openapi-mock/" }

[dependency-groups]
dev = []

[tool.setuptools]
packages.find.where = [ "src" ]
package-data.openapi_mock = [ "py.typed" ]
zip-safe = false

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.ruff]
target-version = "py312"
line-length = 88
lint.extend-select = [ "C901", "ERA001" ]
lint.unfixable = [ "ERA001" ]
lint.external = [ "NOD" ]
lint.flake8-tidy-imports.banned-api."typing.cast".msg = "typing.cast is banned: use explicit type narrowing or a typed variable instead."
lint.mccabe.max-complexity = 12

[tool.pylint]
DEPRECATED_BUILTINS.bad-functions = [
    # Use Pylint until Ruff can ban bare builtin calls, or until custom rules
    # make this removable:
    # https://github.com/astral-sh/ruff/issues/10079
    # https://github.com/astral-sh/ruff/issues/970
    "filter",
    "getattr",
    "hasattr",
    "map",
    "setattr",
]
# Return non-zero exit code if useless-suppression is emitted.
MAIN.fail-on = [
    "useless-suppression",
]
MASTER.jobs = 0
MASTER.load-plugins = [
    "pylint.extensions.bad_builtin",
    "pylint_per_file_ignores",
]
MESSAGES-CONTROL.disable = [
    "duplicate-code",
    "import-outside-toplevel",
    "line-too-long",
    "reimported",
    "too-many-branches",
    "too-many-return-statements",
    "ungrouped-imports",
    "unspecified-encoding",
    "unused-argument",
    "unused-import",
    "wrong-import-order",
]
MESSAGES-CONTROL.enable = [ "spelling" ]
MESSAGES-CONTROL.per-file-ignores = [
    "docs/source/conf.py:invalid-name",
    "docs/source/doccmd_*.py:missing-module-docstring,invalid-name",
    "doccmd_README_rst_*.py:missing-module-docstring,invalid-name",
    "tests/test_parametrized.py:too-many-lines,too-many-arguments",
]
SPELLING.spelling-dict = "en_US"
SPELLING.spelling-private-dict-file = "spelling_private_dict.txt"
SPELLING.spelling-store-unknown-words = "no"

[tool.interrogate]
fail-under = 100
verbose = 2
omit-covered-files = true

[tool.check-manifest]
ignore = [
    "*.pyc",
    ".editorconfig",
    ".git_archival.txt",
    ".prettierrc",
    ".vale.ini",
    ".vscode/*.json",
    "__pycache__",
    "__pycache__/**",
    "CHANGELOG.rst",
    "CODE_OF_CONDUCT.rst",
    "conftest.py",
    "CONTRIBUTING.rst",
    "docs",
    "docs/**",
    "docs/build",
    "docs/build/**",
    "newsfragments",
    "newsfragments/**",
    "prek.toml",
    "spelling_private_dict.txt",
    "tests",
    "tests/**",
    "uv.lock",
    "zizmor.yml",
]

[tool.deptry]
optional_dependencies_dev_groups = [ "dev", "release" ]

[tool.vulture]
exclude = [ ".venv" ]
ignore_names = [
    "add_openapi_to_responses",
    "add_openapi_to_respx",
    "base_url",
    # Sphinx
    "copybutton_exclude",
    "extensions",
    "html_show_copyright",
    "html_show_sourcelink",
    "html_show_sphinx",
    "html_theme",
    "html_theme_options",
    "html_title",
    "htmlhelp_basename",
    "intersphinx_mapping",
    "nitpick_ignore",
    "nitpicky",
    "project_copyright",
    # pytest configuration
    "pytest_collect_file",
    "request",
    "rst_prolog",
    "spelling_word_list_filename",
    "templates_path",
    "towncrier_draft_autoversion_mode",
    "towncrier_draft_include_empty",
    "towncrier_draft_working_directory",
]

[tool.pyproject-fmt]
indent = 4
keep_full_version = true
max_supported_python = "3.14"

[tool.mypy]
files = [ "." ]
exclude = [ ".venv", "build" ]
exclude_gitignore = true
strict = true
plugins = [ "mypy_strict_kwargs" ]

[tool.pyrefly]
errors.non-exhaustive-match = "error"

[tool.pyright]
typeCheckingMode = "strict"
exclude = [ ".venv", "build" ]
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = true

[tool.ty]
terminal.error-on-warning = true
analysis.respect-type-ignore-comments = false

[tool.pytest]
ini_options.xfail_strict = true
ini_options.log_cli = true

[tool.coverage]
run.source = [ "src/openapi_mock" ]
run.branch = true
report.fail_under = 100
report.exclude_also = [ "if TYPE_CHECKING:" ]
report.show_missing = true

[tool.towncrier]
# The changelog and the per-release GitHub release notes are both built
# from news fragments under ``newsfragments/``.  The release workflow
# runs ``towncrier build`` to assemble them; contributors add one
# fragment file per user-facing change.
directory = "newsfragments"
filename = "CHANGELOG.rst"
# Custom template so an assembled version reproduces the historical
# style exactly: a bare ``<version>`` heading (no project name, no
# date) followed by a flat bullet list with no per-type sub-headings.
template = "docs/towncrier_template.rst.jinja"
title_format = "{version}"
issue_format = "#{issue}"
# ``title_format`` underline first, then any nested headings.  A bare
# version such as ``2026.05.18`` underlined with ``-`` matches every
# pre-towncrier entry in CHANGELOG.rst.
underlines = [ "-", "~", "^" ]
type = [
    # A single, unnamed fragment type keeps the assembled output as one
    # flat bullet list, matching the historical changelog (which never
    # grouped entries under "Features"/"Bugfixes"/... sub-headings).
    { directory = "change", name = "", showcontent = true },
]

[tool.pydocstringformatter]
write = true
split-summary-body = false
max-line-length = 88

[tool.doc8]
max_line_length = 2000
ignore_path = [
    "./.eggs",
    "./docs/build",
    "./node_modules",
    "./src/*.egg-info/",
]

[tool.yamlfix]
section_whitelines = 1
whitelines = 1

[tool.no_defaults]
private_only = true
per_file_enforcement."tests/**" = "all"
